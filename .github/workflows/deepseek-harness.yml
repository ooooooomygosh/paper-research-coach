name: DeepSeek Harness source checks
on:
  pull_request:
    paths: ['ports/deepseek-harness/**', '.github/workflows/deepseek-harness.yml']
  push:
    branches: [main]
    paths: ['ports/deepseek-harness/**', '.github/workflows/deepseek-harness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: ports/deepseek-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ports/deepseek-harness/upstream/frontend/package-lock.json
      - run: npm --prefix upstream/frontend ci
      - run: npm --prefix upstream/frontend run build
      - run: python -X utf8 upstream/scripts/prepare_licenses.py
      - run: python -X utf8 -m pip install -e './upstream[dev]' PyPDF2==3.0.1
      - run: python -X utf8 scripts/prepare_integrations.py
      - run: python -X utf8 scripts/verify_source.py
