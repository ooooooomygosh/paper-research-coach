name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: python -m pip install hatchling pytest pyyaml reportlab build
      - run: python scripts/prepare_licenses.py
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/validate_skill.py
      - run: npm --prefix frontend audit --audit-level=high
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: paper-research-coach-packages
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paper-research-coach-packages
          path: dist
      - name: Publish tagged packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0-rc.3' }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its original artifacts."
          else
            gh release create "$TAG" dist/* --target "$COMMIT" --title "Paper Research Coach $TAG" --generate-notes --prerelease
          fi
