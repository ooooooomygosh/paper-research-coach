name: Reading browser checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    # Pinned: playwright==1.58.0 does not support the Ubuntu 26.04 that ubuntu-latest now resolves to.
    # Move this and the Playwright pin together.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: python scripts/prepare_licenses.py
      - run: python -m pip install -e . 'playwright==1.58.0'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_showcase.py --output showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-showcase
          path: showcase/*.png
          if-no-files-found: warn
          retention-days: 14
